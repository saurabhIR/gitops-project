apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitops-postgres-pvc
  namespace: gitops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-postgres
  namespace: gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-postgres
  template:
    metadata:
      labels:
        app: gitops-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: gitops
            - name: POSTGRES_PASSWORD
              value: gitopspass
            - name: POSTGRES_DB
              value: gitopsdb
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: gitops-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-postgres
  namespace: gitops
spec:
  selector:
    app: gitops-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
