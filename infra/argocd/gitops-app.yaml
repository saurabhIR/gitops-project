apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/cascade
spec:
  project: default
  source:
    # Replace with your GitHub repo URL after you push this project, e.g.:
    # https://github.com/saurabhIR/gitops-project.git
    repoURL: 'https://github.com/saurabhIR/gitops-project.git'
    targetRevision: HEAD
    path: infra/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
