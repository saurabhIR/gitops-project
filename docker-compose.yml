services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gitops
      POSTGRES_PASSWORD: gitopspass
      POSTGRES_DB: gitopsdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitops -d gitopsdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gitops-backend:local
    ports:
      - 3001:3000
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=gitops
      - POSTGRES_PASSWORD=gitopspass
      - POSTGRES_DB=gitopsdb
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gitops-frontend:local
    ports:
      - 3000:3000
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
